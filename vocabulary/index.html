<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#6c4cff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="WordQuest"><link rel="manifest" href="/vocabulary/manifest.webmanifest"><link rel="apple-touch-icon" href="/vocabulary/icon.svg"><title>WordQuest</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><link rel="stylesheet" href="/vocabulary/style.css"></head><body><main id="app"><section id="login" class="screen login-screen"><div class="mascot">🦉</div><div class="brand">WQ</div><h1>WordQuest</h1><p>Build your vocabulary. Level up your words. 🚀</p><input id="email" type="email" autocomplete="email" placeholder="School email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn">Start my quest</button><small id="loginMsg"></small></section><section id="home" hidden><header><div><small>WORDQUEST</small><h1>Vocabulary Adventure</h1></div><div class="level-pill">⚡ <span id="xp">0</span> XP</div></header><div class="streakbar"><span>🔥 <b id="streak">1</b> day streak</span><span>🏆 Level <b id="level">1</b></span><button id="logout" class="mini">Sign out</button></div><nav><button data-view="today" class="active"><span>🚀</span>Quest</button><button data-view="cards"><span>🃏</span>Cards</button><button data-view="weekly"><span>🏆</span>Challenge</button><button data-view="history"><span>🗓️</span>Journey</button><button data-view="settings"><span>⚙️</span>Settings</button></nav><div id="content"></div></section></main><script src="/vocabulary/app.js"></script></body></html>
