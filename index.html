<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
AI Learning Switchboard
</title>

<style>

:root {

  --bg: #f7f8fc;
  --card: #ffffff;
  --text: #1e2430;
  --muted: #667085;
  --line: #e7eaf0;

  --accent: #4f46e5;
  --accent-light: #eef2ff;

  --good: #067647;
  --bad: #b42318;

}

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--bg);
  color: var(--text);

}

.shell {

  max-width: 1100px;
  margin: auto;
  padding: 24px;

}

.hero {

  padding:
    18px 0
    10px;

}

.hero h1 {

  font-size:
    clamp(
      28px,
      5vw,
      44px
    );

  margin:
    0 0 8px;

}

.hero p {

  color: var(--muted);
  margin: 0;

}

/* SWITCHES */

.modes {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0, 1fr)
    );

  gap: 12px;

  margin:
    22px 0;

}

.mode {

  background: white;

  border:
    1px solid
    var(--line);

  border-radius: 18px;

  padding: 16px;

  text-align: left;

  cursor: pointer;

  transition:
    0.18s;

}

.mode:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 8px 24px
    rgba(
      16,
      24,
      40,
      0.08
    );

}

.mode.active {

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px
    rgba(
      79,
      70,
      229,
      0.10
    );

}

.icon {

  font-size: 25px;

}

.mode b {

  display: block;

  margin-top: 7px;

}

.mode small {

  display: block;

  color:
    var(--muted);

  margin-top: 4px;

  line-height: 1.35;

}

/* INPUT */

.compose {

  display: flex;

  gap: 10px;

  background: white;

  border:
    1px solid
    var(--line);

  padding: 10px;

  border-radius: 18px;

  position: sticky;

  top: 8px;

  z-index: 10;

}

input {

  flex: 1;

  border: 0;

  outline: none;

  font-size: 16px;

  padding: 10px;

  background:
    transparent;

  min-width: 0;

}

button {

  border: 0;

  border-radius: 12px;

  padding:
    11px 16px;

  font-weight: 700;

  cursor: pointer;

}

.primary {

  background:
    var(--accent);

  color: white;

}

.secondary {

  background:
    #f2f4f7;

  color:
    #344054;

}

.result {

  margin-top: 20px;

  min-height: 100px;

}

.panel {

  background: white;

  border:
    1px solid
    var(--line);

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 14px;

}

/* LOADING */

.loading {

  display: flex;

  align-items: center;

  gap: 10px;

  color:
    var(--muted);

}

.spinner {

  width: 18px;
  height: 18px;

  border:
    2px solid #ddd;

  border-top-color:
    var(--accent);

  border-radius: 50%;

  animation:
    spin 0.8s
    linear infinite;

}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

/* IMAGES */

.generated-image {

  display: block;

  width: 100%;

  max-width: 760px;

  margin:
    0 auto;

  border-radius: 20px;

  box-shadow:
    0 10px 35px
    rgba(
      16,
      24,
      40,
      0.14
    );

}

/* QUIZ */

.quiz-question {

  margin-bottom: 25px;

}

.quiz-question h3 {

  font-size: 17px;

  margin:
    0 0 12px;

}

.option {

  display: flex;

  gap: 10px;

  align-items:
    flex-start;

  width: 100%;

  text-align: left;

  border:
    1px solid
    var(--line);

  background: white;

  margin:
    8px 0;

  padding: 13px;

  border-radius: 12px;

  font-weight: 500;

}

.option:hover {

  background:
    #fafaff;

}

.option.selected {

  border-color:
    var(--accent);

  background:
    var(--accent-light);

}

.option.correct {

  border-color:
    #12b76a;

  background:
    #ecfdf3;

}

.option.wrong {

  border-color:
    #f04438;

  background:
    #fef3f2;

}

.feedback {

  font-size: 14px;

  margin-top: 9px;

  padding: 10px;

  border-radius: 10px;

  background:
    #f9fafb;

  color:
    #475467;

}

.quiz-actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}

.score {

  font-weight: 800;

  margin:
    15px 0;

  color:
    var(--accent);

}

/* FLASHCARDS */

.flash-wrap {

  text-align: center;

}

.flashcard {

  max-width: 650px;

  height: 330px;

  margin:
    10px auto
    20px;

  perspective:
    1000px;

  cursor: pointer;

}

.flash-inner {

  position:
    relative;

  width: 100%;
  height: 100%;

  transition:
    transform 0.5s;

  transform-style:
    preserve-3d;

}

.flashcard.flipped
.flash-inner {

  transform:
    rotateY(180deg);

}

.flash-face {

  position:
    absolute;

  inset: 0;

  backface-visibility:
    hidden;

  border:
    1px solid
    var(--line);

  border-radius:
    24px;

  background:
    white;

  display: flex;

  align-items:
    center;

  justify-content:
    center;

  padding: 36px;

  box-shadow:
    0 10px 30px
    rgba(
      16,
      24,
      40,
      0.08
    );

  font-size:
    clamp(
      22px,
      4vw,
      32px
    );

  font-weight: 800;

}

.flash-back {

  transform:
    rotateY(180deg);

  background:
    #f7f5ff;

  font-size:
    clamp(
      18px,
      3vw,
      25px
    );

  font-weight: 650;

}

.flash-controls {

  display: flex;

  justify-content:
    center;

  align-items:
    center;

  gap: 10px;

  flex-wrap: wrap;

}

.counter {

  color:
    var(--muted);

  min-width:
    80px;

}

/* TEACH ME */

.lesson-section {

  padding:
    14px 0;

  border-top:
    1px solid
    var(--line);

}

.callout {

  background:
    #f7f5ff;

  border-left:
    4px solid
    var(--accent);

  padding:
    14px 16px;

  border-radius:
    10px;

  margin-top:
    14px;

}

.recap {

  display: grid;

  gap: 8px;

}

.recap div {

  background:
    #f9fafb;

  padding:
    10px 12px;

  border-radius:
    10px;

}

/* NOTES */

.notes-section {

  padding:
    14px 0;

  border-top:
    1px solid
    var(--line);

}

.keywords {

  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0, 1fr)
    );

  gap: 10px;

}

.keyword {

  background:
    #f9fafb;

  border:
    1px solid
    var(--line);

  padding: 12px;

  border-radius:
    12px;

}

.keyword b {

  display: block;

  margin-bottom: 4px;

}

.tip {

  background:
    #fff7ed;

  border:
    1px solid
    #fed7aa;

  padding:
    11px 13px;

  border-radius:
    12px;

  margin:
    8px 0;

}

/* ERROR */

.error {

  background:
    #fff1f0;

  border:
    1px solid
    #fecdca;

  color:
    #b42318;

  padding: 14px;

  border-radius: 14px;

}

/* MOBILE */

@media
(max-width: 760px) {

  .modes {

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

  }

  .compose {

    flex-wrap:
      wrap;

  }

  .compose input {

    flex-basis:
      100%;

  }

  .compose button {

    flex: 1;

  }

  .keywords {

    grid-template-columns:
      1fr;

  }

  .shell {

    padding: 16px;

  }

  .flashcard {

    height:
      290px;

  }

}

</style>

</head>

<body>

<div class="shell">

<div class="hero">

<h1>
AI Learning Switchboard
</h1>

<p>
Choose a learning mode.
Each switch uses its own native experience.
</p>

</div>


<div
  class="modes"
  id="modes">

<button
  class="mode active"
  data-mode="handwritten">

<span class="icon">
✍️
</span>

<b>
/handwritten
</b>

<small>
Handwritten notebook image
</small>

</button>


<button
  class="mode"
  data-mode="visualise">

<span class="icon">
👁️
</span>

<b>
/visualise
</b>

<small>
Educational visual explanation
</small>

</button>


<button
  class="mode"
  data-mode="teachme">

<span class="icon">
🎓
</span>

<b>
/teachme
</b>

<small>
Structured tutoring lesson
</small>

</button>


<button
  class="mode"
  data-mode="quiz">

<span class="icon">
❓
</span>

<b>
/quiz
</b>

<small>
Interactive multiple-choice quiz
</small>

</button>


<button
  class="mode"
  data-mode="flashcard">

<span class="icon">
🃏
</span>

<b>
/flashcard
</b>

<small>
Tap-to-flip study cards
</small>

</button>


<button
  class="mode"
  data-mode="notes">

<span class="icon">
📝
</span>

<b>
/notes
</b>

<small>
Structured revision notes
</small>

</button>

</div>


<div class="compose">

<input
  id="topic"
  placeholder="Enter a topic, e.g. mitochondria">

<button
  class="primary"
  id="generate">

Generate

</button>

<button
  class="secondary"
  id="clear">

Clear

</button>

</div>


<div
  class="result"
  id="result">
</div>

</div>


<script>

let mode =
  "handwritten";

const modes =
  document.querySelectorAll(
    ".mode"
  );

const topic =
  document.getElementById(
    "topic"
  );

const result =
  document.getElementById(
    "result"
  );

const generate =
  document.getElementById(
    "generate"
  );


modes.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        modes.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );

        button.classList.add(
          "active"
        );

        mode =
          button.dataset.mode;

      }
    );

  }
);


topic.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      generate.click();

    }

  }
);


document
.getElementById(
  "clear"
)
.addEventListener(
  "click",
  () => {

    topic.value = "";

    result.innerHTML =
      "";

    topic.focus();

  }
);


generate.addEventListener(
  "click",
  async () => {

    const value =
      topic.value.trim();

    if (!value) {

      result.innerHTML =
        `
        <div class="error">
        Please enter a topic first.
        </div>
        `;

      return;

    }

    let loadingText =
      "Building your learning experience...";

    if (
      mode ===
      "handwritten"
      ||
      mode ===
      "visualise"
    ) {

      loadingText =
        "Creating your visual...";

    }

    result.innerHTML =
      `
      <div class="panel loading">

      <span class="spinner">
      </span>

      ${loadingText}

      </div>
      `;

    generate.disabled =
      true;

    try {

      const response =
        await fetch(
          "/api/generate",
          {

            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                mode: mode,
                topic: value
              })

          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Generation failed"
        );

      }

      render(data);

    }

    catch (error) {

      result.innerHTML =
        `
        <div class="error">
        ${escapeHtml(
          error.message
        )}
        </div>
        `;

    }

    finally {

      generate.disabled =
        false;

    }

  }
);


function render(data) {

  if (
    data.type ===
    "image"
  ) {

    renderImage(data);

    return;

  }

  if (
    data.type ===
    "quiz"
  ) {

    renderQuiz(data);

    return;

  }

  if (
    data.type ===
    "flashcards"
  ) {

    renderFlashcards(
      data
    );

    return;

  }

  if (
    data.type ===
    "lesson"
  ) {

    renderLesson(data);

    return;

  }

  if (
    data.type ===
    "notes"
  ) {

    renderNotes(data);

    return;

  }

  result.innerHTML =
    `
    <div class="error">
    Unsupported response type.
    </div>
    `;

}


/* IMAGE */

function renderImage(data) {

  result.innerHTML =
    `
    <img
      class="generated-image"
      src="${data.image}"
      alt="Generated educational visual">
    `;

}


/* QUIZ */

function renderQuiz(data) {

  const questions =
    Array.isArray(
      data.questions
    )
    ?
    data.questions
    :
    [];

  result.innerHTML =
    `
    <div class="panel">

    <h2>
    ${escapeHtml(
      data.title ||
      "Quiz"
    )}
    </h2>

    <div id="quizBox">
    </div>

    <div class="quiz-actions">

    <button
      class="primary"
      id="submitQuiz">

    Check answers

    </button>

    <button
      class="secondary"
      id="resetQuiz">

    Reset

    </button>

    </div>

    <div id="scoreBox">
    </div>

    </div>
    `;


  const box =
    document.getElementById(
      "quizBox"
    );

  const selections =
    {};


  questions.forEach(
    (question, questionIndex) => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "quiz-question";

      wrapper.innerHTML =
        `
        <h3>
        ${questionIndex + 1}.
        ${escapeHtml(
          question.question
        )}
        </h3>
        `;


      question.options.forEach(
        (option, optionIndex) => {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "option";

          button.innerHTML =
            `
            <span>
            ${String.fromCharCode(
              65 +
              optionIndex
            )}.
            </span>

            <span>
            ${escapeHtml(
              option
            )}
            </span>
            `;


          button.onclick =
            () => {

              selections[
                questionIndex
              ] =
                optionIndex;

              wrapper
              .querySelectorAll(
                ".option"
              )
              .forEach(
                item =>
                  item
                  .classList
                  .remove(
                    "selected"
                  )
              );

              button
              .classList
              .add(
                "selected"
              );

            };


          wrapper.appendChild(
            button
          );

        }
      );


      const feedback =
        document.createElement(
          "div"
        );

      feedback.className =
        "feedback";

      feedback.style.display =
        "none";

      feedback.id =
        `feedback-${questionIndex}`;

      wrapper.appendChild(
        feedback
      );

      box.appendChild(
        wrapper
      );

    }
  );


  document
  .getElementById(
    "submitQuiz"
  )
  .onclick =
    () => {

      let score =
        0;

      questions.forEach(
        (question, questionIndex) => {

          const wrapper =
            box.children[
              questionIndex
            ];

          const options =
            wrapper
            .querySelectorAll(
              ".option"
            );


          options.forEach(
            (option, optionIndex) => {

              option
              .classList
              .remove(
                "correct",
                "wrong"
              );


              if (
                optionIndex ===
                Number(
                  question.correctIndex
                )
              ) {

                option
                .classList
                .add(
                  "correct"
                );

              }


              if (
                selections[
                  questionIndex
                ] ===
                optionIndex
                &&
                optionIndex !==
                Number(
                  question.correctIndex
                )
              ) {

                option
                .classList
                .add(
                  "wrong"
                );

              }

            }
          );


          if (
            selections[
              questionIndex
            ] ===
            Number(
              question.correctIndex
            )
          ) {

            score++;

          }


          const feedback =
            document.getElementById(
              `feedback-${questionIndex}`
            );

          feedback.style.display =
            "block";

          feedback.textContent =
            question.explanation ||
            "";

        }
      );


      document
      .getElementById(
        "scoreBox"
      )
      .innerHTML =
        `
        <div class="score">

        Score:
        ${score}
        /
        ${questions.length}

        </div>
        `;

    };


  document
  .getElementById(
    "resetQuiz"
  )
  .onclick =
    () => {

      renderQuiz(data);

    };

}


/* FLASHCARDS */

function renderFlashcards(
  data
) {

  const cards =
    Array.isArray(
      data.cards
    )
    ?
    data.cards
    :
    [];

  let index =
    0;


  result.innerHTML =
    `
    <div
      class="panel flash-wrap">

    <h2>
    ${escapeHtml(
      data.title ||
      "Flashcards"
    )}
    </h2>


    <div
      class="flashcard"
      id="flashcard">

    <div
      class="flash-inner">

    <div
      class="flash-face flash-front"
      id="flashFront">
    </div>

    <div
      class="flash-face flash-back"
      id="flashBack">
    </div>

    </div>

    </div>


    <div
      class="flash-controls">

    <button
      class="secondary"
      id="previousCard">

    Previous

    </button>


    <span
      class="counter"
      id="counter">
    </span>


    <button
      class="secondary"
      id="flipCard">

    Flip

    </button>


    <button
      class="primary"
      id="nextCard">

    Next

    </button>

    </div>

    </div>
    `;


  const card =
    document.getElementById(
      "flashcard"
    );


  function showCard() {

    if (
      cards.length === 0
    ) {

      return;

    }

    card
    .classList
    .remove(
      "flipped"
    );


    document
    .getElementById(
      "flashFront"
    )
    .textContent =
      cards[index].front;


    document
    .getElementById(
      "flashBack"
    )
    .textContent =
      cards[index].back;


    document
    .getElementById(
      "counter"
    )
    .textContent =
      `${index + 1} / ${cards.length}`;

  }


  card.onclick =
    () => {

      card
      .classList
      .toggle(
        "flipped"
      );

    };


  document
  .getElementById(
    "flipCard"
  )
  .onclick =
    () => {

      card
      .classList
      .toggle(
        "flipped"
      );

    };


  document
  .getElementById(
    "previousCard"
  )
  .onclick =
    () => {

      index =
        (
          index -
          1 +
          cards.length
        )
        %
        cards.length;

      showCard();

    };


  document
  .getElementById(
    "nextCard"
  )
  .onclick =
    () => {

      index =
        (
          index +
          1
        )
        %
        cards.length;

      showCard();

    };


  showCard();

}


/* TEACH ME */

function renderLesson(
  data
) {

  const sections =
    Array.isArray(
      data.sections
    )
    ?
    data.sections
    :
    [];

  const recap =
    Array.isArray(
      data.recap
    )
    ?
    data.recap
    :
    [];


  result.innerHTML =
    `
    <div
      class="panel lesson">

    <h2>
    ${escapeHtml(
      data.title ||
      "Lesson"
    )}
    </h2>

    <p>
    ${escapeHtml(
      data.overview ||
      ""
    )}
    </p>


    ${sections.map(
      section =>
        `
        <div
          class="lesson-section">

        <h3>
        ${escapeHtml(
          section.heading
        )}
        </h3>

        <p>
        ${escapeHtml(
          section.content
        )}
        </p>

        </div>
        `
    ).join("")}


    ${
      data.example
      ?
      `
      <div
        class="callout">

      <b>
      ${escapeHtml(
        data.example.heading ||
        "Example"
      )}
      </b>

      <p>
      ${escapeHtml(
        data.example.content ||
        ""
      )}
      </p>

      </div>
      `
      :
      ""
    }


    ${
      data.checkQuestion
      ?
      `
      <div
        class="callout">

      <b>
      Check yourself
      </b>

      <p>
      ${escapeHtml(
        data.checkQuestion
      )}
      </p>

      <button
        class="secondary"
        id="showLessonAnswer">

      Show answer

      </button>

      <p
        id="lessonAnswer"
        style="display:none">

      ${escapeHtml(
        data.answer ||
        ""
      )}

      </p>

      </div>
      `
      :
      ""
    }


    ${
      recap.length
      ?
      `
      <h3>
      Quick recap
      </h3>

      <div
        class="recap">

      ${recap.map(
        item =>
          `
          <div>
          ${escapeHtml(
            item
          )}
          </div>
          `
      ).join("")}

      </div>
      `
      :
      ""
    }

    </div>
    `;


  const showAnswer =
    document.getElementById(
      "showLessonAnswer"
    );

  if (showAnswer) {

    showAnswer.onclick =
      () => {

        document
        .getElementById(
          "lessonAnswer"
        )
        .style.display =
          "block";

        showAnswer.style.display =
          "none";

      };

  }

}


/* NOTES */

function renderNotes(
  data
) {

  const sections =
    Array.isArray(
      data.sections
    )
    ?
    data.sections
    :
    [];

  const keywords =
    Array.isArray(
      data.keywords
    )
    ?
    data.keywords
    :
    [];

  const tips =
    Array.isArray(
      data.examTips
    )
    ?
    data.examTips
    :
    [];


  result.innerHTML =
    `
    <div
      class="panel notes">

    <h2>
    ${escapeHtml(
      data.title ||
      "Revision Notes"
    )}
    </h2>


    <p>
    ${escapeHtml(
      data.summary ||
      ""
    )}
    </p>


    ${sections.map(
      section =>
        `
        <div
          class="notes-section">

        <h3>
        ${escapeHtml(
          section.heading
        )}
        </h3>

        <ul>

        ${(section.bullets || [])
          .map(
            bullet =>
              `
              <li>
              ${escapeHtml(
                bullet
              )}
              </li>
              `
          )
          .join("")
        }

        </ul>

        </div>
        `
    ).join("")}


    ${
      keywords.length
      ?
      `
      <h3>
      Key words
      </h3>

      <div
        class="keywords">

      ${keywords.map(
        keyword =>
          `
          <div
            class="keyword">

          <b>
          ${escapeHtml(
            keyword.term
          )}
          </b>

          <span>
          ${escapeHtml(
            keyword.meaning
          )}
          </span>

          </div>
          `
      ).join("")}

      </div>
      `
      :
      ""
    }


    ${
      tips.length
      ?
      `
      <h3>
      Exam tips
      </h3>

      ${tips.map(
        tip =>
          `
          <div
            class="tip">

          ${escapeHtml(
            tip
          )}

          </div>
          `
      ).join("")}
      `
      :
      ""
    }

    </div>
    `;

}


/* SECURITY */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    character => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    })[character]
  );

}
