<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Learning Hub</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;color:#24324a;background:linear-gradient(135deg,#fff4fa,#edfaff,#f7f1ff);min-height:100vh;padding:22px}
.wrap{max-width:1100px;margin:auto} header{text-align:center;padding:18px}.logo{display:inline-block;background:#fff;padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px #24324a18}
h1{font-size:clamp(2.1rem,6vw,4rem);margin:18px 0 7px;background:linear-gradient(90deg,#ff4f8b,#8b5cf6,#06b6d4,#22c55e);-webkit-background-clip:text;color:transparent}.sub{color:#64748b;margin:0 auto;max-width:700px}
.panel,.result-card{background:#ffffffdd;backdrop-filter:blur(10px);border-radius:28px;padding:24px;box-shadow:0 12px 35px #24324a18;margin-top:22px}.title{font-weight:800;font-size:1.1rem;margin-bottom:16px}
.switches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sw{border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer;min-height:125px;box-shadow:0 7px 18px #24324a12;transition:.2s;background:#fff;color:#24324a}.sw:hover{transform:translateY(-3px)}.sw.active{outline:4px solid #8b5cf655}.sw .e{font-size:2rem;display:block;margin-bottom:8px}.sw small{display:block;color:#64748b;margin-top:6px}
.sw:nth-child(1){background:#ffe5ef}.sw:nth-child(2){background:#dff8ff}.sw:nth-child(3){background:#ece5ff}.sw:nth-child(4){background:#fff4bf}.sw:nth-child(5){background:#dcfae7}.sw:nth-child(6){background:#ffe9d7}
label{display:block;font-weight:800;margin:22px 0 9px}textarea{width:100%;min-height:105px;border:2px solid #e5e7eb;border-radius:18px;padding:16px;font:inherit;font-size:1rem;outline:none}textarea:focus{border-color:#8b5cf6}.actions{display:flex;gap:12px;margin-top:15px;flex-wrap:wrap}button.action{border:0;border-radius:15px;padding:14px 20px;font-weight:800;font-size:1rem;cursor:pointer}.generate{color:white;background:linear-gradient(90deg,#ff4f8b,#8b5cf6,#06b6d4)}.clear{background:#eef2f7}.result{display:none}.result.show{display:block}.head{display:flex;gap:12px;align-items:center}.head h2{margin:0}.badge{background:#eef2ff;padding:6px 10px;border-radius:999px;font-weight:800;font-size:.85rem;display:inline-block;margin-top:4px}.content{line-height:1.65;margin-top:18px}.content h1,.content h2,.content h3{color:#5b21b6}.content pre{white-space:pre-wrap;font-family:inherit}.loading{padding:25px;text-align:center;font-size:1.1rem}.spinner{display:inline-block;width:24px;height:24px;border:4px solid #ddd;border-top-color:#8b5cf6;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#fff0f0;color:#a11;padding:14px;border-radius:14px}@media(max-width:700px){body{padding:12px}.switches{grid-template-columns:repeat(2,1fr)}.panel,.result-card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">🌟 AI LEARNING HUB</div><h1>Learn. Explore. Create.</h1><p class="sub">Choose a learning switch and let AI create personalised content for you.</p></header>

<div class="panel">
<div class="title">🎛️ Choose your learning switch</div>
<div class="switches">
<button class="sw active" data-mode="handwritten"><span class="e">✍️</span><b>/handwritten</b><small>Notebook-style study notes</small></button>
<button class="sw" data-mode="visualise"><span class="e">👁️</span><b>/visualise</b><small>Learn through imagination</small></button>
<button class="sw" data-mode="teachme"><span class="e">🎓</span><b>/teachme</b><small>Friendly teacher explanation</small></button>
<button class="sw" data-mode="quiz"><span class="e">❓</span><b>/quiz</b><small>Test your knowledge</small></button>
<button class="sw" data-mode="flashcard"><span class="e">🃏</span><b>/flashcard</b><small>Quick revision cards</small></button>
<button class="sw" data-mode="notes"><span class="e">📝</span><b>/notes</b><small>Smart revision notes</small></button>
</div>
<label for="topic">🧠 What do you want to learn?</label>
<textarea id="topic" placeholder="Example: Mitochondria for Year 9"></textarea>
<div class="actions"><button class="action generate" id="generate">🚀 Generate with AI</button><button class="action clear" id="clear">Clear</button></div>
</div>

<div class="result" id="result"><div class="result-card"><div class="head"><div id="emoji" style="font-size:2rem">✍️</div><div><h2 id="heading">Your Learning Result</h2><span class="badge" id="badge">/handwritten</span></div></div><div class="content" id="content"></div></div></div>
</div>
<script>
const info={handwritten:["✍️","Handwritten-Style Notes","/handwritten"],visualise:["👁️","Visual Learning Journey","/visualise"],teachme:["🎓","Teach Me","/teachme"],quiz:["❓","Knowledge Quiz","/quiz"],flashcard:["🃏","Revision Flashcards","/flashcard"],notes:["📝","Smart Study Notes","/notes"]};
let mode="handwritten";
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".sw").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
function markdown(text){
 let safe=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 safe=safe.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
 safe=safe.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>");
 safe=safe.replace(/^- (.*)$/gm,"• $1");
 return safe.split(/\n\n+/).map(p=>p.startsWith("<h")||p.startsWith("•")?p:`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}
document.getElementById("generate").onclick=async()=>{
 const topic=document.getElementById("topic").value.trim(); if(!topic){document.getElementById("topic").focus();return;}
 const r=document.getElementById("result"),c=document.getElementById("content"),i=info[mode];
 document.getElementById("emoji").textContent=i[0];document.getElementById("heading").textContent=i[1];document.getElementById("badge").textContent=i[2];
 r.classList.add("show");c.innerHTML='<div class="loading"><span class="spinner"></span> AI is preparing your learning activity...</div>';r.scrollIntoView({behavior:"smooth"});
 try{
  const response=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,mode})});
  const data=await response.json(); if(!response.ok)throw new Error(data.error||"Something went wrong");
  c.innerHTML=markdown(data.text);
 }catch(e){c.innerHTML='<div class="error">⚠️ '+e.message+'</div>';}
};
document.getElementById("clear").onclick=()=>{document.getElementById("topic").value="";document.getElementById("result").classList.remove("show")};
</script>
</body>
</html>
